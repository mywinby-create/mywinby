<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>더하기 빼기 퀴즈 · 초등 1학년</title>
<meta name="description" content="초등학교 1학년 수준의 덧셈·뺄셈 연습 퀴즈. 난이도를 골라 10문제를 풀어 보세요.">
<meta name="theme-color" content="#ffb703">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>➕</text></svg>">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">

  <!-- ===== 홈 화면 ===== -->
  <section id="screen-home" class="screen" aria-labelledby="home-title">
    <header class="hero">
      <p class="hero__badge">초등학교 1학년</p>
      <h1 id="home-title" class="hero__title">더하기 빼기 퀴즈</h1>
      <p class="hero__sub">한 판에 10문제! 별 3개에 도전해 보세요.</p>
    </header>

    <div class="card">
      <h2 class="card__title">무엇을 풀까요?</h2>
      <div class="choice-group" role="radiogroup" aria-label="연산 선택" id="operation-group">
        <button type="button" class="choice" role="radio" data-operation="add" aria-checked="true">
          <span class="choice__icon" aria-hidden="true">＋</span><span class="choice__label">덧셈</span>
        </button>
        <button type="button" class="choice" role="radio" data-operation="sub" aria-checked="false">
          <span class="choice__icon" aria-hidden="true">－</span><span class="choice__label">뺄셈</span>
        </button>
        <button type="button" class="choice" role="radio" data-operation="mixed" aria-checked="false">
          <span class="choice__icon" aria-hidden="true">＋－</span><span class="choice__label">섞어서</span>
        </button>
      </div>
    </div>

    <div class="card">
      <h2 class="card__title">얼마나 어렵게 할까요?</h2>
      <div class="choice-group choice-group--stack" role="radiogroup" aria-label="난이도 선택" id="level-group">
        <button type="button" class="choice choice--wide" role="radio" data-level="1" aria-checked="true">
          <span class="choice__icon" aria-hidden="true">🐣</span>
          <span class="choice__label">1단계 · 한 자리 수<small>9까지의 덧셈과 뺄셈</small></span>
        </button>
        <button type="button" class="choice choice--wide" role="radio" data-level="2" aria-checked="false">
          <span class="choice__icon" aria-hidden="true">🐤</span>
          <span class="choice__label">2단계 · 십몇까지<small>10 모으기와 가르기</small></span>
        </button>
        <button type="button" class="choice choice--wide" role="radio" data-level="3" aria-checked="false">
          <span class="choice__icon" aria-hidden="true">🐔</span>
          <span class="choice__label">3단계 · 받아올림과 받아내림<small>18까지의 덧셈과 뺄셈</small></span>
        </button>
      </div>
    </div>

    <p class="best" id="best-record" hidden></p>

    <button type="button" class="btn btn--primary btn--big" id="start-button">퀴즈 시작하기</button>

    <div class="card card--qr">
      <h2 class="card__title">친구와 함께 풀어요</h2>
      <p class="card__desc">휴대폰 카메라로 QR 코드를 비추면 이 퀴즈가 열려요.</p>
      <div class="qr" id="qr-box" aria-live="polite"></div>
      <p class="qr__url" id="qr-url"></p>
      <div class="qr__actions">
        <button type="button" class="btn btn--ghost" id="copy-url-button">주소 복사</button>
        <button type="button" class="btn btn--ghost" id="edit-url-button" aria-expanded="false" aria-controls="qr-edit">주소 바꾸기</button>
      </div>
      <form class="qr__edit" id="qr-edit" hidden>
        <label class="qr__label" for="qr-input">QR 코드에 담을 주소</label>
        <input class="qr__input" id="qr-input" type="url" inputmode="url" placeholder="https://example.com/quiz" autocomplete="off">
        <div class="qr__actions">
          <button type="submit" class="btn btn--ghost">이 주소로 만들기</button>
          <button type="button" class="btn btn--ghost" id="reset-url-button">기본 주소로</button>
        </div>
        <p class="qr__error" id="qr-error" role="alert" hidden></p>
      </form>
    </div>

    <footer class="foot">
      <button type="button" class="btn btn--ghost btn--small" id="sound-toggle" aria-pressed="true">🔊 소리 켬</button>
    </footer>
  </section>

  <!-- ===== 퀴즈 화면 ===== -->
  <section id="screen-quiz" class="screen" aria-labelledby="quiz-title" hidden>
    <h1 id="quiz-title" class="sr-only">퀴즈 풀기</h1>
    <header class="quiz-top">
      <button type="button" class="btn btn--ghost btn--small" id="quit-button">← 그만하기</button>
      <p class="progress-text"><span id="progress-now">1</span> / <span id="progress-total">10</span></p>
      <p class="score-text" aria-label="맞힌 개수">⭐ <span id="score-now">0</span></p>
    </header>
    <div class="progress-bar"><div class="progress-bar__fill" id="progress-fill"></div></div>

    <div class="question" id="question-box">
      <p class="question__text" id="question-text" aria-live="polite">
        <span id="q-left">1</span>
        <span id="q-symbol">+</span>
        <span id="q-right">1</span>
        <span class="question__equals">=</span>
        <span class="question__answer" id="answer-display">?</span>
      </p>
    </div>

    <p class="feedback" id="feedback" role="status" aria-live="assertive"></p>

    <div class="keypad" id="keypad" role="group" aria-label="숫자 입력">
      <button type="button" class="key" data-digit="1">1</button>
      <button type="button" class="key" data-digit="2">2</button>
      <button type="button" class="key" data-digit="3">3</button>
      <button type="button" class="key" data-digit="4">4</button>
      <button type="button" class="key" data-digit="5">5</button>
      <button type="button" class="key" data-digit="6">6</button>
      <button type="button" class="key" data-digit="7">7</button>
      <button type="button" class="key" data-digit="8">8</button>
      <button type="button" class="key" data-digit="9">9</button>
      <button type="button" class="key key--action" id="clear-key" aria-label="지우기">⌫</button>
      <button type="button" class="key" data-digit="0">0</button>
      <button type="button" class="key key--submit" id="submit-key">확인</button>
    </div>
  </section>

  <!-- ===== 결과 화면 ===== -->
  <section id="screen-result" class="screen" aria-labelledby="result-title" hidden>
    <div class="result">
      <p class="result__stars" id="result-stars" aria-hidden="true">☆☆☆</p>
      <h1 id="result-title" class="result__title">10문제 중 <span id="result-correct">0</span>문제 정답!</h1>
      <p class="result__message" id="result-message"></p>
      <p class="result__best" id="result-best" hidden></p>
    </div>

    <div class="card" id="review-card" hidden>
      <h2 class="card__title">다시 볼 문제</h2>
      <ul class="review" id="review-list"></ul>
    </div>

    <div class="result__actions">
      <button type="button" class="btn btn--primary btn--big" id="retry-button">한 번 더 풀기</button>
      <button type="button" class="btn btn--ghost" id="home-button">처음 화면으로</button>
    </div>
  </section>

</div>

<script src="js/qrcode.js"></script>
<script src="js/quiz.js"></script>
<script src="js/app.js"></script>
</body>
</html>
